[package]
name = "server"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tower-http = { version = "0.6", features = ["fs"] }
async-imap = "0.9"
tokio-native-tls = "0.3"
reqwest = { version = "0.11", features = ["json"] }
mail-parser = "0.8"